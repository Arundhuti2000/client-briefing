# Golden set for the held-out dataset, round 2 (data/generate_holdout.py). Same fields as
# eval/golden.yaml, plus must_not_flag: controls that look like traps but must NOT be flagged.
# Written from what a correct briefing should say, never adjusted to what the rules do.
# Round 1 is now development data (eval/dev2/); its honest score is in eval/history/.
# Label fix after the first run: opportunity_count counts every listed deal (lost ones too), as in
# eval/golden.yaml; it had been written as live deals only (1 and 2 instead of 2 and 3).
aliases:
  - {name: "Vossberg", expect: C301, trap: T1}
  - {name: "Vossberg Drives", expect: C301, trap: T1}
  - {name: "VOSSBERG ANTRIEBSTECHNIK GMBH", expect: C301}
  - {name: "Vossberg Antriebstechnik", expect: C301}          # without "GmbH"
  - {name: "LRS", expect: C302, trap: T1}
  - {name: "Lattice Ridge Software", expect: C302}
  - {name: "LatticeRidge Software Inc", expect: C302, trap: T2}
  - {name: "C318", expect: C302, trap: T2}
  - {name: "Cedar Hollow", expect: C303}
  - {name: "Cedar Hollow Building Supply", expect: C303}    # without "Co."
  - {name: "Lattice Semiconductor", expect: null}
  - {name: "Vossberg Haus", expect: null}
  - {name: "Cedar Ridge Supply", expect: null}

documents:
  - {doc: note_301, expect: C301, trap: T1}
  - {doc: email_302, expect: C301, trap: T1}
  - {doc: email_312, expect: C302, trap: T1}
  - {doc: email_313, expect: C302, trap: T2}
  - {doc: note_321, expect: C303, trap: T7}
  - {doc: news_321, expect: null, trap: T8}

trap_flags:
  T4: stale_statement
  T5: conflict
  T6: conflict
  T8: unresolved_reference
  T11: excluded_source
  T12: overdue

restricted_sources: ["SQL:opportunities:OPP-VOS-MA", "DOC:brief_301"]

cases:
  - client: C301
    user: u2
    must_include:
      - {field: revenue_latest, value: 3050000, trap: T4}
      - {field: cfo, value: "Katrin Brandt"}
      - {field: not_live_opportunity, value: OPP-VOS-RPF, trap: T6}
      - {field: live_opportunity, value: OPP-VOS-FX}
      - {field: opportunity_count, value: 2, trap: T9}   # FX and the lost deal; not the restricted one
      - {field: overdue_action, value: A-301, trap: T12}
    must_flag: [T4, T6, T8, T12]
    must_not_flag:
      - {type: excluded_source, source: "DOC:news_301", trap: T11}   # "REUTERS" is Reuters
      - {type: conflict, source: "SQL:contacts:CT301", trap: T5}     # "Matthias Keller" is "Dr. Matthias Keller"
    must_not_include: ["OPP-VOS-MA", "brief_301", "Lindwurm", "aftermarket"]
  - client: C301
    user: u1
    must_include:
      - {field: opportunity, value: OPP-VOS-MA, trap: T9}
      - {field: opportunity_count, value: 3, trap: T9}   # with the restricted deal
    must_flag: [T6, T12]
  - client: C302
    user: u2
    must_include:
      - {field: revenue_latest, value: 1320000}
      - {field: contact, value: "Robert Hartley", trap: T3}
      - {field: contact, value: "Helen Duarte", trap: T2}
      - {field: action, value: A-303, trap: T2}
      - {field: live_opportunity, value: OPP-LRS-SWP}
    must_flag: [T5, T11]
    must_not_flag:
      - {type: conflict, source: "SQL:opportunities:OPP-LRS-SWP", trap: T6}  # a commitment on a live deal
      - {type: conflict, source: "SQL:contacts:CT312", trap: T5}            # "Bob Hartley" is Robert Hartley
      - {type: overdue, source: "SQL:open_actions:A-302", trap: T12}        # done
    must_not_claim:
      - "revenue doubled"             # T10
      - "move all of its cash"
  - client: C302
    user: u1
    must_flag: [T5]
  - client: C303
    user: u2
    must_include:
      - {field: revenue_latest, value: 520000}
      - {field: contact, value: "Marie Tremblay"}
      - {field: live_opportunity, value: OPP-CHB-EQ}
      - {field: action, value: A-304}

routing:
  - {question: "What's our wallet share with them now?", expect: metrics}
  - {question: "Who runs treasury over there?", expect: people}
  - {question: "Which opportunities are still live?", expect: pipeline}
  - {question: "What do we still owe them from the last meeting?", expect: actions}
  - {question: "Is any of our data out of date?", expect: data_quality}
  - {question: "What did Katrin Brandt say about the Mexico plant?", expect: documents}
  - {question: "Has there been any press coverage recently?", expect: news}
  - {question: "Write a LinkedIn post about this client", expect: out_of_scope}
