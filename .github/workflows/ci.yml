# Every push: the unit tests and the evaluation scorecard, with the template LLM only
# (no API keys, no requests). The scorecard exits non-zero on any restricted leakage or
# injected claim, which fails the build.
name: CI

on: push

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      LLM_CHAIN: mock          # never call a real model in CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install (CPU-only PyTorch first, so pip doesn't fetch the CUDA build)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache the embedding model (all-MiniLM-L6-v2)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Unit tests
        run: make test

      - name: Evaluation scorecard (mock mode)
        run: make eval
